[package]
name = "subcraft-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
update-fixture = ["subcraft-app/update-fixture"]

[dependencies]
subcraft-core.workspace = true
subcraft-image.workspace = true
image.workspace = true
subcraft-mesh.workspace = true
subcraft-doc.workspace = true
subcraft-materials.workspace = true
subcraft-paint.workspace = true
subcraft-bake.workspace = true
subcraft-export.workspace = true
subcraft-assets.workspace = true
subcraft-text.workspace = true
subcraft-render.workspace = true
subcraft-compositor.workspace = true
subcraft-app.workspace = true
glam.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
rfd.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
regex-lite.workspace = true
web-time.workspace = true
pollster.workspace = true

# Native pen tablet input (issue #82): the same crates and versions winit already uses.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
# dlopen: no hard link to libwayland-client, so X11-only systems still start.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-cursor = "0.31"
x11rb = { version = "0.13", features = ["xinput"] }

[dev-dependencies]
subcraft-mesh.workspace = true
rayon.workspace = true
mimalloc.workspace = true
