[package]
name = "subcraft-spp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Substance Painter .spsm / .spmsk / .spp decode (experimental)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
hdf5-reader = { version = "0.9.1", default-features = false }
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjpeg-sys"] }

[features]
# Enabled in the follow-up PR that adds Painter Assimp/assbin mesh extraction for `.spp` open.
painter-assimp-host = []

[dev-dependencies]
tempfile = "3"
subcraft-mesh = { path = "../mesh" }
