[package]
name = "subcraft-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Local update integration fixtures only; never enabled in shipped builds.
update-fixture = []

[dependencies]
subcraft-core.workspace = true
subcraft-image.workspace = true
subcraft-mesh.workspace = true
subcraft-doc.workspace = true
subcraft-materials.workspace = true
subcraft-compositor.workspace = true
subcraft-paint.workspace = true
subcraft-bake.workspace = true
subcraft-project.workspace = true
subcraft-export.workspace = true
subcraft-assets.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
semver = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zip.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
flate2 = "1"

[dev-dependencies]
rayon.workspace = true
mimalloc.workspace = true
