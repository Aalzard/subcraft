[package]
name = "subcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "subcraft"
path = "src/main.rs"

[features]
# Packaged Windows builds: run as a GUI app (no console window). `scripts/build-windows.ps1` enables it.
windows-gui = []

[dependencies]
subcraft-ui.workspace = true
eframe.workspace = true
log.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
