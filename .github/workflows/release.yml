name: Release

# Publishing a GitHub Release (e.g. tag v0.2.0) builds the Windows installer and portable zip
# and attaches both. Pull requests that touch the packaging only build them, as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-windows.ps1
      - scripts/build-installer.ps1
      - installer/**
      - apps/subcraft/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Inno Setup 6 is preinstalled on the Windows Server 2025 image; install it if that changes.
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) {
            Write-Host "Found $iscc"
          } else {
            choco install innosetup --no-progress -y
            if (-not (Test-Path $iscc)) { throw "Inno Setup install failed" }
          }
      - name: Build exe, zip and installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SubCraft-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Attach to release
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SubCraft-windows-x64
          path: dist
      - name: Upload installer and zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "${{ github.event.release.tag_name }}" dist/*-setup.exe dist/*.zip --clobber --repo "${{ github.repository }}"
