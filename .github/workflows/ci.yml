name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Many integration-test binaries link the whole workspace; without debug info and incremental
  # state the Linux runner stays within its disk (it ran out of space with the defaults).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Software Vulkan (lavapipe) so the rendering tests run instead of skipping.
      - name: Install Mesa Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace --exclude subcraft-render
      # One GPU test at a time: lavapipe can crash (SIGSEGV) when several tests create devices at once.
      - name: Test rendering (one GPU test at a time)
        run: cargo test -p subcraft-render -- --test-threads=1
      # The real application, started the way a user starts it, on a machine with no GPU: the
      # start-up probe, the window, the viewport and the screenshot path all have to work on
      # software rendering (lavapipe / llvmpipe) under an X server.
      - name: Build the application
        run: cargo build -p subcraft
      - name: Start headless (Xvfb, software rendering)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1-mesa-dri libxkbcommon-x11-0
          ./scripts/ci-smoke-start.sh target/debug/subcraft "$RUNNER_TEMP/smoke"
      - name: Upload smoke-start screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # Oldest supported glibc. The release tarball is built on this base (see release.yml); this job
  # proves the tree still builds and starts there, and prints the glibc version the binary needs.
  linux-old-glibc:
    name: Build + start (Ubuntu 20.04, glibc 2.31)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and runtime packages
        run: |
          # archive.ubuntu.com drops connections now and then; a failed index fetch makes every
          # package "unavailable". Retry downloads, and the whole update, before giving up.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80retries
          # (focal's apt 2.0 still exits 0 when an index fails, so look at its output.)
          for i in 1 2 3; do
            apt-get update 2>&1 | tee /tmp/apt-update.log
            grep -Eq '^(Err:|W: Failed to fetch|E: )' /tmp/apt-update.log || break
            sleep 20
          done
          apt-get install -y --no-install-recommends ca-certificates curl git gcc g++ pkg-config binutils \
            xvfb mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxkbcommon0
          # The X11 client libraries winit loads at run time (dlopen). A desktop install always has
          # them; a minimal container does not, and winit then fails with "Failed to load one of
          # xlib's shared libraries".
          apt-get install -y --no-install-recommends libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libwayland-client0
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-20.04
      - name: Build the application
        run: cargo build -p subcraft
      - name: Required glibc version
        run: ./scripts/check-linux-binary.sh target/debug/subcraft 2.31
      - name: Start headless (Xvfb, software rendering)
        run: ./scripts/ci-smoke-start.sh target/debug/subcraft "$RUNNER_TEMP/smoke"
      - name: Upload smoke-start screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-old-glibc
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  windows:
    name: Build + engine tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Engine tests
        run: cargo test -p subcraft-core -p subcraft-image -p subcraft-mesh -p subcraft-doc -p subcraft-materials -p subcraft-compositor -p subcraft-paint -p subcraft-bake -p subcraft-project -p subcraft-export -p subcraft-assets -p subcraft-app
      # A Windows machine without a usable GPU: the runner only has the Microsoft Basic Render
      # Driver (WARP), which is also what a user with a broken or missing driver ends up on.
      - name: Start headless (WARP)
        shell: pwsh
        run: ./scripts/ci-smoke-start.ps1 -Executable target\debug\subcraft.exe -OutDir "$env:RUNNER_TEMP\smoke"
      - name: Upload smoke-start screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: ${{ runner.temp }}\smoke
          if-no-files-found: ignore
